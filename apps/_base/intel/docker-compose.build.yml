---
name: build-base-intel

services:
  intel:
    build:
      target: build-intel-final
      dockerfile: ./_base/intel/Dockerfile
      context: ../../
    platform: linux/amd64
    image: ghcr.io/futursolo/pai-apps/base:intel${PAI_BUILD_VERSION_SUFFIX}

  pytorch-xpu:
    build:
      target: build-pytorch-xpu-final
      dockerfile: ./_base/intel/Dockerfile
      context: ../../
    platform: linux/amd64
    image: ghcr.io/futursolo/pai-apps/base:pytorch-v2.14.1-xpu${PAI_BUILD_VERSION_SUFFIX}
