---
name: build-koboldcpp

services:
  rocm:
    build:
      dockerfile: ./koboldcpp/rocm/Dockerfile
      context: ../
      target: build-final
      args:
        - ROCM_DEV_IMAGE=rocm/dev-ubuntu-26.04:7.14.0-full
        - KOBOLDCPP_VERSION=v1.119
    platform: linux/amd64
    image: ghcr.io/futursolo/pai-apps/koboldcpp:v1.119.0-rocm-v7.14.0${PAI_BUILD_VERSION_SUFFIX}
  rocm-variant:
    extends: rocm
    image: ghcr.io/futursolo/pai-apps/koboldcpp:rocm${PAI_BUILD_VARIANT_SUFFIX}

  vulkan:
    build:
      dockerfile: ./koboldcpp/vulkan/Dockerfile
      context: ../
      target: build-final
      args:
        - VULKAN_BASE_IMAGE=ghcr.io/futursolo/pai-apps/base:vulkan-20260610
        - KOBOLDCPP_VERSION=v1.119
    platform: linux/amd64
    image: ghcr.io/futursolo/pai-apps/koboldcpp:v1.119.0-vulkan${PAI_BUILD_VERSION_SUFFIX}
  vulkan-variant:
    extends: vulkan
    image: ghcr.io/futursolo/pai-apps/koboldcpp:vulkan${PAI_BUILD_VARIANT_SUFFIX}
