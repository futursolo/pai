---
on:
  workflow_dispatch:

name: Build Base Container

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Base Containers
    permissions:
      contents: write
      packages: write

    steps:
      - name: Maximize build space
        uses: ./actions/maximize-build-space
        with:
          # Special path shared by Docker (data-root) and containerd (root).
          build-mount-path: /var/lib/pai-build

      - name: Checkout Project
        uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define Image Suffixs (Release)
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          _DATE_VER=$(date +'%Y%m%d')
          IMAGE_VERSION_SUFFIX=-${_DATE_VER}
          IMAGE_VARIANT_SUFFIX=""

          echo "PAI_BUILD_VERSION_SUFFIX=${IMAGE_VERSION_SUFFIX}" >> $GITHUB_ENV
          echo "PAI_BUILD_VARIANT_SUFFIX=${IMAGE_VARIANT_SUFFIX}" >> $GITHUB_ENV

      - name: Define Image Suffixs (Release)
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          IMAGE_VERSION_SUFFIX=-preview
          IMAGE_VARIANT_SUFFIX=-preview

          echo "PAI_BUILD_VERSION_SUFFIX=${IMAGE_VERSION_SUFFIX}" >> $GITHUB_ENV
          echo "PAI_BUILD_VARIANT_SUFFIX=${IMAGE_VARIANT_SUFFIX}" >> $GITHUB_ENV

      - name: Build and Push Base Images
        run: |
          docker compose -f docker-compose.build.yml build
          docker compose -f docker-compose.build.yml push
        working-directory: apps/_base
